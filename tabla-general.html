<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hechos prevenibles – Ojos en Alerta – Jul a Sep 2025 vs 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --head:#3f3532; --head-ink:#ffffff; --mes:#5cb8f2; --mes-ink:#1c2a36; --sub:#4b403d;
  --bg:#e9e6e4; --card:#ffffff; --row:#f6f5f4; --ink:#2a2523; --muted:#8a817d; --line:#d8d3d0;
  --y26:#eef3cf; --y26-ink:#3d4a10; --warn-bg:#fff4d6; --warn-ink:#6b4e00; --nf:#b3aba7;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1d1a19; --card:#26221f; --row:#2c2825; --ink:#ece7e4; --muted:#a59c97; --line:#3e3835;
  --y26:#39401f; --y26-ink:#e3edb3; --warn-bg:#3b3118; --warn-ink:#f3d58b; --nf:#6f6762; --sub:#4b403d;
}}
:root[data-theme="dark"]{
  --bg:#1d1a19; --card:#26221f; --row:#2c2825; --ink:#ece7e4; --muted:#a59c97; --line:#3e3835;
  --y26:#39401f; --y26-ink:#e3edb3; --warn-bg:#3b3118; --warn-ink:#f3d58b; --nf:#6f6762;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Archivo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden}
header.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;background:var(--head);color:var(--head-ink);padding:14px 22px;border-left:6px solid #1e1817}
header.top h1{margin:0;text-align:center;font:600 22px/1.2 "Archivo",system-ui,sans-serif;letter-spacing:.02em}
header.top h1 span{display:block;font-weight:400;font-size:13px;opacity:.75;letter-spacing:0;margin-top:3px}
.periodo{text-align:right;font-size:12px;opacity:.8}
.periodo b{display:block;font-size:20px;opacity:1;font-weight:600}
.aviso{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--warn-ink);padding:10px 22px;font-size:13px;border-bottom:1px solid var(--line)}
.aviso strong{white-space:nowrap}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--line)}
.tools label{font-size:12px;color:var(--muted)}
.tools select,.tools input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:3px;padding:6px 8px;min-width:0}
.tools input{flex:1 1 200px;max-width:320px}
.back{font:600 13px "Archivo",sans-serif;background:#5cb8f2;color:#1c2a36;text-decoration:none;border-radius:3px;padding:7px 12px;white-space:nowrap}
.tools .count{margin-left:auto;font-size:12px;color:var(--muted)}
:focus-visible{outline:2px solid var(--mes);outline-offset:2px}
.tbl{overflow:auto;max-height:62vh}
table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
th.barrios{width:28%}
.ab2{display:none}
thead th{position:sticky;z-index:2;background:var(--head);color:#fff}
thead tr:first-child th{top:0}
thead tr:nth-child(2) th{top:34px}
th.barrios{font:700 15px "Archivo",sans-serif;letter-spacing:.25em;text-align:left;padding:0 14px}
th.small{width:52px}
td.b{overflow:hidden;text-overflow:ellipsis}
th.mesh{padding:5px 3px 3px;height:34px}
th.mesh div{background:var(--mes);color:var(--mes-ink);font:700 12px Georgia,"Times New Roman",serif;letter-spacing:.24em;text-align:center;padding:4px 0}
th.yr{background:var(--sub);font:500 12px "Archivo Narrow",sans-serif;letter-spacing:.12em;padding:4px 6px;text-align:center}
th.tot div{background:#cfc6c2;color:#2a2523}
th.small{font:500 11px "Archivo",sans-serif;padding:0 8px;text-align:left;color:#d9d0cc}
tbody td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even) td{background:var(--row)}
tbody tr:hover td{background:color-mix(in srgb,var(--mes) 14%,var(--card))}
td.n{text-align:center;font-variant-numeric:tabular-nums}
td.n.y26{color:var(--y26-ink)}
td.n.z{color:var(--muted)}
td.sep{border-left:2px solid var(--line)}
td.c,td.u{color:var(--muted);font-size:12px}
td.b{font-size:13px}
tr.nf td.b{color:var(--nf);font-style:italic}
tr.nf td.b::after{content:" · sin registros en la base";font-size:11px}
tr.grp td{background:var(--card)!important;font:600 12px "Archivo",sans-serif;color:var(--ink);padding-top:12px;border-bottom:2px solid var(--head)}
tr.grp td .gt{color:var(--muted);font-weight:500;margin-left:8px}
.totales{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--head);padding:10px}
.box{background:#4b403d;border-radius:3px;overflow:hidden}
.box h3{margin:0;background:var(--mes);color:var(--mes-ink);text-align:center;font:700 15px "Archivo Narrow",sans-serif;letter-spacing:.06em;padding:4px}
.box.tt h3{background:#cfc6c2;color:#2a2523}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}
.pair div{border-radius:6px;padding:4px 8px;background:#fff;color:#2a2523}
.pair div.y{background:#eef3cf;color:#3d4a10}
.pair small{display:block;font-size:11px;opacity:.7}
.pair b{font:500 24px/1.1 "Archivo",sans-serif;font-variant-numeric:tabular-nums}
.var{grid-column:1/-1;text-align:center;color:#e9e2df;font-size:12px;padding:0 0 2px}
.ab{display:none}
.notas{padding:14px 22px;font-size:12px;color:var(--muted);line-height:1.55}
.notas p{margin:0 0 6px;max-width:80ch}
@media (max-width:1100px){td.b{white-space:normal;overflow:visible}th.barrios{width:24%;letter-spacing:.12em}th.mesh div{letter-spacing:.08em}}
@media (max-width:760px){
  header.top{grid-template-columns:auto 1fr;padding:12px 14px}
  .periodo{grid-column:1/-1;text-align:left}
  header.top h1{text-align:left;font-size:18px}
  .totales{grid-template-columns:1fr 1fr}
  .tools,.aviso,.notas{padding-left:14px;padding-right:14px}
  .wrap{padding:6px}
  .tools{display:grid;grid-template-columns:auto 1fr;gap:8px 10px}
  .tools input,.tools select{max-width:none;width:100%}
  .tools .count{margin:0;grid-column:1/-1}
  .back{grid-column:1/-1;text-align:center}
  th.mesh div{font-family:"Archivo",sans-serif}
  .tbl{max-height:none}
  table{min-width:0;table-layout:fixed}
  thead th{position:static}
  th.barrios{width:30%;letter-spacing:.05em;font-size:12px;padding:0 6px;min-width:0}
  th.small,td.u{display:none}
  th.mesh div{letter-spacing:0;font-size:11px}
  .fl{display:none}.ab{display:inline}
  th.yr{letter-spacing:0;font-size:9.5px;padding:3px 0}
  tbody td{padding:4px 2px;font-size:10.5px}
  td.n{width:auto}
  td.b{white-space:normal;word-break:break-word;padding-left:6px}
  tr.nf td.b::after{content:" · sin registros"}
  tr.grp td .gt{display:block;margin:2px 0 0}
}
@media (max-width:420px){
  th.yr .fl{display:none} th.yr .ab2{display:inline}
  th.yr{font-size:10px}
}
@media print{.tools{display:none}.tbl{max-height:none;overflow:visible}body{background:#fff}}
</style>
</head>

    h+=`<tr class="${r[9]?'nf':''}"><td class="b">${r[2]}</td><td class="u">${r[1]===24?'24 bis':r[1]}</td>`+
      cell(r[3],0,1)+cell(r[4],1)+cell(r[5],0,1)+cell(r[6],1)+cell(r[7],0,1)+cell(r[8],1)+cell(t25,0,1)+cell(t26,1)+`</tr>`;
  }
  document.getElementById('tb').innerHTML=h||'<tr><td colspan="10" style="padding:18px;color:var(--muted)">Ningún barrio coincide con la búsqueda. Probá con otro nombre o elegí "Todos" en Cuadrante.</td></tr>';
  document.getElementById('cnt').textContent=`${rows.length} de ${D.length} barrios`;
  const meses=['JULIO','AGOSTO','SEPTIEMBRE'];let b='';
  meses.forEach((m,i)=>{b+=box(m,sum[i*2],sum[i*2+1],'')});
  b+=box('TOTAL',sum[0]+sum[2]+sum[4],sum[1]+sum[3]+sum[5],'tt');
  document.getElementById('tot').innerHTML=b;
}
function box(t,a,c,cls){const v=a?((c-a)/a*100):0;return `<div class="box ${cls}"><h3>${t}</h3><div class="pair"><div><small>2025</small><b>${fmt(a)}</b></div><div class="y"><small>2026${PARCIAL?'*':''}</small><b>${fmt(c)}</b></div><div class="var">${a?(v>0?'+':'')+v.toFixed(1).replace('.',',')+' %':'–'}${PARCIAL?' · *2026 parcial':''}</div></div></div>`}
[fc,fs,fo].forEach(e=>e.addEventListener('input',render));
render();
</script>
</body>
