<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hechos prevenibles por DJP – Julio a Septiembre 2025/2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --slate:#444444; --brown:#3f3532; --brown2:#4b403d; --cel:#5cb8f2; --cel-ink:#14232f;
  --y26:#eef3cf; --y26-ink:#3d4a10; --line:#cfc9c6; --row:#f6f5f4; --ink:#2a2523; --muted:#8a817d;
  --app:#e7e4e2; --side:#ffffff; --side-ink:#55504d; --side-act:#bcd6f3; --side-act-ink:#0b5cad; --paper:#ffffff;
  --mono:"IBM Plex Mono",Consolas,"Courier New",monospace; --sans:"Archivo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--app:#1c1a19;--side:#252220;--side-ink:#cfc8c4;--side-act:#23405e;--side-act-ink:#bfe0ff;--paper:#2a2624;--row:#312c29;--ink:#efe9e6;--muted:#a49b96;--line:#45403c;--y26-ink:#e3edb3}}
:root[data-theme="dark"]{--app:#1c1a19;--side:#252220;--side-ink:#cfc8c4;--side-act:#23405e;--side-act-ink:#bfe0ff;--paper:#2a2624;--row:#312c29;--ink:#efe9e6;--muted:#a49b96;--line:#45403c;--y26-ink:#e3edb3}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--app);color:var(--ink);font:14px/1.4 var(--sans);display:flex}
#navwrap{width:210px;flex:none;background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:14px 0 20px;height:100%}
#nav button{display:block;width:calc(100% - 12px);text-align:left;border:0;background:none;color:var(--side-ink);font:13px var(--sans);padding:9px 18px;border-radius:0 20px 20px 0;cursor:pointer}
#nav button.grp{color:var(--cel);font-size:12px;padding-top:4px;padding-bottom:4px;cursor:default}
#nav button.djp{padding-left:30px}
#nav button[aria-current="page"]{background:var(--side-act);color:var(--side-act-ink);font-weight:600}
#nav button:not(.grp):hover{background:color-mix(in srgb,var(--side-act) 45%,transparent)}
:focus-visible{outline:2px solid var(--cel);outline-offset:2px}
main{flex:1;overflow:auto;padding:18px;height:100%}
.page{display:none;max-width:1080px;margin:0 auto}
.page.on{display:block}
.slide{background:var(--slate);color:#fff;aspect-ratio:1045/735;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);text-align:center;padding:4%}
.slide .corner{position:absolute;top:3%;right:2%;width:8.5%}
.cover img{width:14%;margin-bottom:7%}
.cover h1{margin:0;font:700 clamp(15px,2.6vw,27px) var(--mono);letter-spacing:.01em}
.rule{display:flex;align-items:center;width:74%;margin:1.6% 0 2%}
.rule::before,.rule::after{content:"";width:clamp(10px,2vw,22px);height:clamp(10px,2vw,22px);border-radius:50%;background:#fff;flex:none}
.rule span{flex:1;height:3px;background:#fff}
.cover h2{margin:0;font:500 clamp(14px,2.3vw,24px) var(--mono)}
.cover p{margin:.6% 0 0;font:700 clamp(11px,1.6vw,17px) var(--mono)}
.section h1{margin:0;font:500 clamp(18px,3vw,32px) var(--mono)}
.section .rule{width:28%;margin-top:1%}
.section .rule span{height:2px}
.section .rule::before,.section .rule::after{width:14px;height:14px}
/* hoja DJP */
.sheet{background:var(--paper);border:1px solid var(--line)}
.sh-head{display:grid;grid-template-columns:90px 1fr 190px;align-items:center;background:var(--brown);color:#fff;border-left:6px solid #1e1817;min-height:58px}
.sh-head img{width:46px;margin-left:20px}
.sh-head h1{margin:0;text-align:center;font:500 19px var(--sans);letter-spacing:.02em}
.sh-head .djp{text-align:center;line-height:1}
.sh-head .djp small{display:block;font-size:13px;opacity:.85;margin-bottom:2px}
.sh-head .djp b{font:400 34px var(--sans)}
.sh-head .djp em{display:block;font-style:normal;font-size:11px;opacity:.7;margin-top:3px}
.tbl{overflow:auto}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:640px}
thead th{background:var(--brown);color:#fff;padding:0}
th.barrios{font:700 15px var(--sans);letter-spacing:.3em;text-align:center;width:40%}
th.mes{padding:5px 4px 2px}
th.mes div{background:var(--cel);color:var(--cel-ink);font:700 12px Georgia,"Times New Roman",serif;letter-spacing:.28em;padding:3px 0}
th.yr{background:var(--brown2);font:500 11px var(--sans);letter-spacing:.2em;padding:3px 0 4px}
tbody td{padding:4px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent);font-size:12.5px}
tbody tr:nth-child(even) td{background:var(--row)}
td.n{text-align:center;font-variant-numeric:tabular-nums;width:10%}
td.n.s{border-left:2px solid #8f8884}
td.n.z{color:var(--muted)}
td.n.y{color:var(--y26-ink)}
tr.nf td.b{color:var(--muted);font-style:italic}
tr.nf td.b::after{content:" (sin registros)";font-size:11px}
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--brown);padding:8px 8px 10px;margin-top:6px}
.mb h3{margin:0;background:var(--cel);color:var(--cel-ink);text-align:center;font:700 15px var(--sans);padding:3px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--brown2);padding:6px}
.pair div{background:#fff;color:#2a2523;border-radius:6px;padding:3px 8px}
.pair div.y{background:var(--y26);color:#3d4a10}
.pair small{display:block;font-size:11px;opacity:.65}
.pair b{font:400 26px/1.1 var(--sans);font-variant-numeric:tabular-nums}
.totbar{background:var(--cel);color:var(--cel-ink);text-align:center;font:700 15px var(--sans);padding:6px}
.tot{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:8px;background:var(--brown);padding:8px;align-items:stretch}
.tot .bx{background:#fff;color:#2a2523;border-radius:4px;text-align:center;padding:10px 6px}
.tot .bx.y{background:var(--y26);color:#3d4a10}
.tot .bx small{display:block;font-size:13px;opacity:.65}
.tot .bx b{font:400 34px/1.15 var(--sans);font-variant-numeric:tabular-nums}
.tot .pct{color:#fff;text-align:center;display:flex;flex-direction:column;justify-content:center;position:relative}
.tot .pct small{font-size:13px;letter-spacing:.02em}
.tot .pct b{font:500 30px var(--sans)}
.tot .pct i{font-style:normal;font-size:11px;opacity:.75}
.fuente{background:var(--brown);color:#fff;text-align:right;font:700 11px var(--mono);padding:0 12px 8px}
.aviso{background:#fff4d6;color:#6b4e00;font-size:12px;padding:7px 14px}
.pager{display:flex;justify-content:space-between;max-width:1080px;margin:12px auto 0;gap:8px}
.pager button{font:13px var(--sans);background:var(--side);color:var(--side-ink);border:1px solid var(--line);border-radius:3px;padding:7px 12px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.mnav{display:none}
.ab{display:none}.ab2{display:none}
.dl{display:block;margin:14px 12px 0;width:calc(100% - 24px);font:600 13px var(--sans);background:var(--cel);color:var(--cel-ink);border:0;border-radius:3px;padding:9px 10px;cursor:pointer}
.dl[hidden]{display:none}
a.dl.lk{background:var(--side);color:var(--side-ink);border:1px solid var(--line);text-align:center;text-decoration:none;box-sizing:border-box}
.upd{display:block;margin:10px 14px 0;font-size:12px;color:var(--muted)}
.dlmsg{font-size:11px;color:var(--muted);margin:6px 14px 0;min-height:1em}
@media (max-width:820px){
  body{display:block;height:auto}
  #navwrap{display:none}
  main{height:auto;padding:10px}
  .mnav{display:block;margin:0 auto 10px;max-width:1080px}
  .mnav select{width:100%;font:14px var(--sans);padding:8px;background:var(--side);color:var(--ink);border:1px solid var(--line);border-radius:3px}
  .sh-head{grid-template-columns:60px 1fr 90px}
  .sh-head img{width:36px;margin-left:10px}
  .sh-head h1{font-size:15px}
  .months{grid-template-columns:1fr}
  table{min-width:0;table-layout:fixed}
  th.barrios{width:34%;letter-spacing:.08em;font-size:12px}
  th.mes div{letter-spacing:.06em;font-size:11px}
  .fl{display:none}.ab{display:inline}
  th.yr{letter-spacing:0;font-size:10px}
  tbody td{padding:4px 3px;font-size:11px}
  td.b{white-space:normal;word-break:break-word;padding-left:6px}
  td.n{width:auto}
  .sh-head .djp em{display:none}
  .sh-head .djp b{font-size:30px}
  .tot{grid-template-columns:1fr 1fr}
  .tot .pct{grid-column:1/-1;padding:6px 0}
}
@media (max-width:420px){th.yr .fl{display:none}th.yr .ab2{display:inline}th.yr{font-size:10px}.pair b{font-size:22px}.tot .bx b{font-size:28px}}
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{display:block;background:#fff}
  #navwrap,.pager,.mnav{display:none}
.ab{display:none}.ab2{display:none}
.dl{display:block;margin:14px 12px 0;width:calc(100% - 24px);font:600 13px var(--sans);background:var(--cel);color:var(--cel-ink);border:0;border-radius:3px;padding:9px 10px;cursor:pointer}
.dl[hidden]{display:none}
a.dl.lk{background:var(--side);color:var(--side-ink);border:1px solid var(--line);text-align:center;text-decoration:none;box-sizing:border-box}
.upd{display:block;margin:10px 14px 0;font-size:12px;color:var(--muted)}
.dlmsg{font-size:11px;color:var(--muted);margin:6px 14px 0;min-height:1em}
  main{overflow:visible;padding:0;height:auto}
  .page{display:block;break-after:page;max-width:none;width:281mm;height:193mm;overflow:hidden;margin:0}
  .page .slide{aspect-ratio:auto;height:193mm;width:100%}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

function section(z){return {id:'zona-'+z.toLowerCase(),name:'ZONA '+z,html:`<section class="slide section"><img class="corner" src="${LOGO}" alt=""><h1>ZONA ${z}</h1><div class="rule"><span></span></div></section>`}}
function cell(v,cls){return `<td class="n ${cls}${v===0?' z':''}">${fmt(v)}</td>`}
function djp(u,zona){
  const rows=D.filter(r=>r[1]===u);
  const s=[0,0,0,0,0,0];rows.forEach(r=>{for(let k=0;k<6;k++)s[k]+=r[3+k]});
  const t25=s[0]+s[2]+s[4],t26=s[1]+s[3]+s[5];
  const v=t25?(t26-t25)/t25*100:0;
  const pctLbl=!t25?'SIN HECHOS EN 2025 PARA COMPARAR':v<=0?'PORCENTAJE DE BAJA EN PREVENIBLES':'PORCENTAJE DE SUBA EN PREVENIBLES';
  const body=rows.map(r=>`<tr class="${r[9]?'nf':''}"><td class="b">${r[2]}</td>${cell(r[3],'s')}${cell(r[4],'y')}${cell(r[5],'s')}${cell(r[6],'y')}${cell(r[7],'s')}${cell(r[8],'y')}</tr>`).join('');
  const mb=(m,a,b)=>`<div class="mb"><h3>${m}</h3><div class="pair"><div><small>2025</small><b>${fmt(a)}</b></div><div class="y"><small>2026</small><b>${fmt(b)}</b></div></div></div>`;
  return {id:'djp-'+lbl(u).replace(' ','-'),name:'DJP - '+lbl(u),zona,html:`<section class="sheet">
  <header class="sh-head"><img src="${LOGO}" alt="Logo"><h1>HECHOS PREVENIBLES</h1><div class="djp"><small>DJP</small><b>${lbl(u)}</b><em>Zona ${zona.toLowerCase()} · ${rows.length} barrios</em></div></header>
  <div class="tbl"><table><thead><tr><th class="barrios" rowspan="2">BARRIOS</th><th class="mes" colspan="2"><div><span class="fl">JULIO</span><span class="ab">JUL</span></div></th><th class="mes" colspan="2"><div><span class="fl">AGOSTO</span><span class="ab">AGO</span></div></th><th class="mes" colspan="2"><div><span class="fl">SEPTIEMBRE</span><span class="ab">SEP</span></div></th></tr>
  <tr><th class="yr"><span class="fl">2025</span><span class="ab2">’25</span></th><th class="yr"><span class="fl">2026</span><span class="ab2">’26</span></th><th class="yr"><span class="fl">2025</span><span class="ab2">’25</span></th><th class="yr"><span class="fl">2026</span><span class="ab2">’26</span></th><th class="yr"><span class="fl">2025</span><span class="ab2">’25</span></th><th class="yr"><span class="fl">2026</span><span class="ab2">’26</span></th></tr></thead><tbody>${body}</tbody></table></div>
  <div class="months">${mb('JULIO',s[0],s[1])}${mb('AGOSTO',s[2],s[3])}${mb('SEPTIEMBRE',s[4],s[5])}</div>
  <div class="totbar">TOTAL</div>
  <div class="tot"><div class="bx"><small>2025</small><b>${fmt(t25)}</b></div><div class="bx y"><small>2026</small><b>${fmt(t26)}</b></div>
  <div class="pct"><small>${pctLbl}</small><b>${t25?Math.abs(v).toFixed(2).replace('.',',')+' %':'–'}</b>${PARCIAL?'<i>*2026 parcial</i>':''}</div></div>
  <div class="fuente">*Fuente de información: SEDEPO LITE</div></section>`}}

let navH='',lastZ=null;

  cont.insertAdjacentHTML('beforeend',`<div class="page" id="${p.id}">${p.html}</div>`);
  if(p.zona&&p.zona!==lastZ){navH+=`<button class="grp" tabindex="-1" aria-hidden="true">▾ ${p.zona}</button>`;lastZ=p.zona}
  navH+=`<button class="${p.zona?'djp':''}" data-i="${i}">${p.name}</button>`;
  msel.insertAdjacentHTML('beforeend',`<option value="${i}">${p.zona?'— ':''}${p.name}</option>`);
});
nav.innerHTML=navH;
let cur=0;
function go(i){cur=Math.max(0,Math.min(pages.length-1,i));
  document.querySelectorAll('.page').forEach((el,k)=>el.classList.toggle('on',k===cur));
  nav.querySelectorAll('button[data-i]').forEach(b=>b.toggleAttribute('aria-current',+b.dataset.i===cur)||0);
  nav.querySelectorAll('button[data-i]').forEach(b=>{if(+b.dataset.i===cur)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  msel.value=cur;document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===pages.length-1;
  document.querySelector('main').scrollTop=0;}
nav.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)go(+b.dataset.i)});
msel.addEventListener('change',()=>go(+msel.value));
document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1)});
go(0);

function unfit(){document.querySelectorAll('.page>*').forEach(c=>c.style.zoom='')}
